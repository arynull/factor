[project]
name = "factor"
version = "0.2.0"
description = "CLI invoicing tool"
requires-python = ">=3.12"
dependencies = ["jdatetime"]

[project.scripts]
factor = "factor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
