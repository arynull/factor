[project]
name = "factor"
version = "1.3.0"
description = "CLI invoicing tool"
requires-python = ">=3.12"
dependencies = ["jdatetime", "fpdf2>=2.8.8", "arabic-reshaper", "python-bidi"]

[project.scripts]
factor = "factor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
